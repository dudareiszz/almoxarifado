{% extends "almoxarifado/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar no sistema</h1>
<p>Informe seu usuário e senha para consultar o estoque.</p>
<form method="post" class="cartao form-pagina" novalidate>
  {% csrf_token %}
  {% include "almoxarifado/_form.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="acoes"><button type="submit" class="btn">Entrar</button></div>
</form>
{% endblock %}
